name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: cd backend && ruff check .
      - run: cd backend && ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_ROOT: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom's undici needs Node 22+; 24 matches the Storybook image and @calliopelabs/ui.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Every story rendered with the a11y checks, and story coverage for ui-app/.
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: boilerworks_test
          POSTGRES_USER: dbadmin
          POSTGRES_PASSWORD: Password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbadmin -d boilerworks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_DATABASE_URL: postgresql+asyncpg://dbadmin:Password123@localhost:5432/boilerworks_test
      APP_REDIS_URL: redis://localhost:6379/1
      APP_DEBUG: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The versions in uv.lock, not the newest that pyproject.toml allows, so
      # a dependency release cannot change the result of an unchanged commit.
      - name: Install dependencies
        run: |
          pip install uv
          cd backend && uv export --frozen --extra dev --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"
      - run: cd backend && PYTHONPATH=. alembic upgrade head
      - run: cd backend && PYTHONPATH=. python -m pytest app/tests/ --cov=app --cov-report=term-missing --cov-fail-under=79 -v
